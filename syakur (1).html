<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="alumna.png">
    <title>RPP SD AIIS</title>
    <style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
    }

    .navbar h1 {
        font-size: 18px;
        margin: 0;
        color: #38bdf8;
    }

    .hero {
        text-align: center;
        padding: 60px 20px;
    }

    .hero h1 {
        font-size: 50px;
        margin-bottom: 1px;
    }

    .hero h2 {
        font-size: 32px;
        margin-bottom: 1px;
    }

        h1, h2 {
        margin: 0;
    }

    h1 {
        margin-bottom: 5px;
    }

    .hero p {
        color: #94a3b8;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px 30px 40px;
        max-width: 1500px;
        margin: auto;
    }

    .card {
        background: rgba(255,255,255,0.05);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(8px);
        transition: 0.3s;
        border: 1px solid rgba(255,255,255,0.08);
    }

    .card:hover {
        transform: translateY(-5px) scale(1.02);
        border-color: #38bdf8;
    }

    .card h3 {
        margin-top: 0;
        color: #f1f5f9;
    }

    .card p {
        color: #94a3b8;
        font-size: 14px;
    }

    .btn {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 16px;
        border-radius: 999px;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        color: white;
        text-decoration: none;
        font-size: 13px;
    }

    .btn:hover {
        opacity: 0.85;
    }

    footer {
        text-align: center;
        padding: 20px;
        font-size: 12px;
        color: #64748b;
    }
    </style>
</head>
<body>

    <div class="navbar">
    <h1>Portal Admin</h1>
    </div>

    <div class="hero">
    <h1>RPP MAPEL PAI MR SYAUKUR</h1>
    <h2>SD ALUMNA INDONESIA ISLAMIC SCHOOL</h2>
    </div>

    <div class="grid">

    <div class="card">
        <h3>RPP PRIMARY 1</h3>
        <p>RPP Deeep Learning PAI Primary 1</p>
        <a href="https://docs.google.com/spreadsheets/d/1VECa5lYMHzT0lP52-sIroXZABj2EoPrrlbQgCFM1OQY/edit?usp=sharing" class="btn" target="_blank">Open</a>
    </div>

    <div class="card">
        <h3>RPP PRIMARY 2</h3>
        <p>RPP Deeep Learning PAI Primary 2</p>
        <a href="https://docs.google.com/spreadsheets/d/1yFZPYOF-HdlWYGCzumIh9fUfga8bhrBddiQ9vd--50Q/edit?usp=sharing" class="btn" target="_blank">Open</a>
    </div>

    <div class="card">
        <h3>RPP PRIMARY 5</h3>
        <p>RPP Deeep Learning PAI Primary 5</p>
        <a href="https://docs.google.com/spreadsheets/d/1EeY7expbkWk3vZjsUZkINRoG-sl9hNRv2s9y5zioKFk/edit?usp=sharing" class="btn" target="_blank">Open</a>
    </div>

    </div>

    <footer>

    </footer>

</body>
</html>
